
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExplorePro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            },
            colors: {
              ios: {
                bg: '#F2F2F7',         // System Gray 6
                card: '#FFFFFF',
                blue: '#007AFF',       // System Blue
                gray: '#8E8E93',       // System Gray
                separator: '#C6C6C8',  // System Separator
                green: '#34C759',
                red: '#FF3B30',
                orange: '#FF9500',
                search: '#E3E3E8'      // Search bar fill
              },
              brand: {
                dark: '#000000',
                primary: '#007AFF',
                primaryHover: '#0062cc',
              }
            },
            boxShadow: {
              'ios': '0 4px 12px rgba(0, 0, 0, 0.05)',
              'ios-lg': '0 8px 24px rgba(0, 0, 0, 0.08)',
            }
          },
        },
      }
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #000;
      }
      .ios-blur {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/"
  }
}
</script>
</head>

    <div id="root"></div>
  </body>
